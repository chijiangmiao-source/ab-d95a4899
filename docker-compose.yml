services:
  app:
    build: .
    image: elf-audit:latest
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 2s
      start_period: 2s
      retries: 10

  verify:
    image: elf-audit:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      AUDIT_BASE_URL: http://app:8080
      PYTHONPATH: /srv
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tests:/srv/tests:ro
      - ./verify.py:/srv/verify.py:ro
    working_dir: /srv
    entrypoint: ["python", "verify.py"]
    command: []
